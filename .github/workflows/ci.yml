name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: folio
          POSTGRES_PASSWORD: folio
          POSTGRES_DB: folio
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U folio -d folio"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://folio:folio@127.0.0.1:5432/folio
      DATABASE_SSL: disable
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        id: install
        continue-on-error: true
        shell: bash
        run: npm ci > npm-ci.log 2>&1
      - name: Upload install log
        if: steps.install.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: npm-ci-log
          path: npm-ci.log
          if-no-files-found: error
          retention-days: 3
      - name: Report install failure
        if: steps.install.outcome == 'failure'
        shell: bash
        run: |
          tail -n 120 npm-ci.log
          exit 1
      - if: steps.install.outcome == 'success'
        run: npm run db:migrate:folio
      - if: steps.install.outcome == 'success'
        run: npm run lint
      - if: steps.install.outcome == 'success'
        run: npm run typecheck
      - if: steps.install.outcome == 'success'
        run: npm run test
      - if: steps.install.outcome == 'success'
        run: npm run build
