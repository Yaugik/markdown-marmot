name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: folio
          POSTGRES_PASSWORD: folio
          POSTGRES_DB: folio
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U folio -d folio"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://folio:folio@127.0.0.1:5432/folio
      DATABASE_SSL: disable
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # package-lock.json predates two optional @emnapi transitive records and
      # currently cannot satisfy npm ci. npm install updates the runner-only
      # lock graph so Phase 2 migrations, types, tests, and build are verified.
      - run: npm install --no-audit --no-fund
      - run: npm run db:migrate:folio
      - name: Lint
        id: lint
        continue-on-error: true
        run: npm run lint > lint.log 2>&1
      - name: Typecheck
        id: typecheck
        continue-on-error: true
        run: npm run typecheck > typecheck.log 2>&1
      - name: Test
        id: test
        continue-on-error: true
        run: npm run test > test.log 2>&1
      - name: Build
        id: build
        continue-on-error: true
        run: npm run build > build.log 2>&1
      - name: Upload verification logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-logs
          path: |
            lint.log
            typecheck.log
            test.log
            build.log
          if-no-files-found: error
          retention-days: 3
      - name: Report verification failures
        if: steps.lint.outcome == 'failure' || steps.typecheck.outcome == 'failure' || steps.test.outcome == 'failure' || steps.build.outcome == 'failure'
        run: |
          for log in lint.log typecheck.log test.log build.log; do
            echo "===== ${log} ====="
            tail -n 80 "${log}"
          done
          exit 1
