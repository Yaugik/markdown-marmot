name: folio-workspace

x-app: &app
  build:
    context: .
  environment:
    DATABASE_URL: postgresql://folio:folio@postgres:5432/folio
    DATABASE_SSL: disable
    DATABASE_PATH: /data/workspace.sqlite
    WORKSPACE_ROOTS: /workspace-repos,/data/demo-repository
    SEED_DEMO: "true"
  volumes:
    - workspace-data:/data
    - ${WORKSPACE_REPOS_PATH:-./fixtures/repositories}:/workspace-repos:ro
  init: true
  restart: unless-stopped

services:
  postgres:
    image: postgres:16-bookworm
    environment:
      POSTGRES_DB: folio
      POSTGRES_USER: folio
      POSTGRES_PASSWORD: folio
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U folio -d folio"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  web:
    <<: *app
    command: ["npm", "run", "start"]
    ports:
      - "127.0.0.1:${PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    <<: *app
    command: ["npm", "run", "worker"]
    environment:
      DATABASE_URL: postgresql://folio:folio@postgres:5432/folio
      DATABASE_SSL: disable
      DATABASE_PATH: /data/workspace.sqlite
      WORKSPACE_ROOTS: /workspace-repos,/data/demo-repository
      SEED_DEMO: "false"
      WORKER_POLL_MS: 750
    depends_on:
      web:
        condition: service_healthy

volumes:
  postgres-data:
  workspace-data:
